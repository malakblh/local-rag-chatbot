<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1280" height="640" fill="#0f172a"/>
  <circle cx="1200" cy="60" r="220" fill="#1e293b" opacity="0.6"/>

  <rect x="80" y="100" width="520" height="440" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- question bubble -->
  <rect x="225" y="135" width="345" height="62" rx="18" fill="#0ea5e9"/>
  <text x="243" y="173" font-size="19" fill="#ffffff">C'est quoi le deep learning ?</text>

  <!-- answer bubble -->
  <rect x="110" y="222" width="440" height="150" rx="18" fill="#334155"/>
  <text x="130" y="262" font-size="19" fill="#f8fafc">Le deep learning est une branche</text>
  <text x="130" y="296" font-size="19" fill="#f8fafc">de l'apprentissage automatique</text>
  <text x="130" y="330" font-size="19" fill="#f8fafc">fondée sur des réseaux de neurones.</text>

  <!-- source tag -->
  <rect x="110" y="392" width="270" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="417" font-size="18" fill="#38bdf8">Source : Ai.pdf, p. 12</text>

  <!-- input bar -->
  <rect x="110" y="466" width="460" height="46" rx="23" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="134" y="496" font-size="18" fill="#64748b">Posez votre question…</text>

  <text x="620" y="245" font-size="72" font-weight="bold" fill="#f8fafc">Local RAG</text>
  <text x="620" y="325" font-size="72" font-weight="bold" fill="#38bdf8">Chatbot</text>
  <text x="620" y="380" font-size="27" fill="#94a3b8">Ask your PDFs, with sources</text>

  <g font-size="24" fill="#f8fafc" text-anchor="middle">
    <rect x="620" y="418" width="150" height="48" rx="24" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="695" y="450">Qdrant</text>
    <rect x="785" y="418" width="150" height="48" rx="24" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="860" y="450">Ollama</text>
    <rect x="950" y="418" width="180" height="48" rx="24" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="1040" y="450">Streamlit</text>
  </g>

  <rect x="620" y="490" width="270" height="58" rx="29" fill="#16a34a"/>
  <text x="755" y="529" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">100% OFFLINE</text>
</svg>
